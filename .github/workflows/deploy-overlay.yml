name: Deploy EDP Overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, edp-overlay]

    steps:
      - name: Test Runner
        shell: powershell
        run: |
          Write-Host "Runner funktioniert."
          Write-Host "Computer: $env:COMPUTERNAME"

      - name: Test Overlay Directory
        shell: powershell
        run: |
          $path = "C:\EDP\Overlays\_github_test"

          if (-not (Test-Path $path)) {
              throw "Overlay-Testordner nicht gefunden: $path"
          }

          Get-ChildItem $path -Recurse

          Write-Host "Overlay-Testordner gefunden."
